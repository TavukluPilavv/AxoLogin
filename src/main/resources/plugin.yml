name: AxoLogin
version: '1.0.0'
main: dev.axo.login.AxoLogin
api-version: '1.21'
description: Turkish login and registration for the Lobby Paper server
author: Axo
commands:
  register:
    description: Oyuncu kaydi
    usage: /register <şifre>
  login:
    description: Oyuncu girisi
    usage: /login <şifre>
  forgot:
    description: Sifre kurtarma bilgisi
    usage: /forgot
  axologin:
    description: AxoLogin yonetici komutlari
    usage: /axologin reset <oyuncu> <yeni-şifre>
    permission: axologin.admin
permissions:
  axologin.admin:
    description: AxoLogin sifre sifirlama yetkisi
    default: op
