# AxoLogin Paper - Lobby ayarlari
timeout-seconds: 120
max-attempts: 3

# Giris yapmayan tum oyuncular ayni bos dunyada bu noktada bekletilir.
void-world: axologin_void
void-x: -1831.236
void-y: 6.0
void-z: -1763.309
void-yaw: -10.7
void-pitch: -2.3

# Giris basarili olunca oyuncu bu dunyanin dogus noktasina gider.
