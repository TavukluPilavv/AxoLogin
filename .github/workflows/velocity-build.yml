name: Build AxoLogin Velocity

on:
  push:
    paths:
      - 'velocity-plugin/**'
      - '.github/workflows/velocity-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Velocity plugin
        working-directory: velocity-plugin
        run: gradle shadowJar
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: AxoLogin-Velocity-JAR
          path: velocity-plugin/build/libs/AxoLogin-Velocity.jar
          if-no-files-found: error
